name: Verify final patch

on:
  push:
    branches:
      - final-code-2026-polish

permissions:
  contents: read

jobs:
  test:
    if: github.event.head_commit.message != 'Clean up temporary patch runners'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check lib/attention.js
      - run: npm test
