name: Complete Signal Watch patch
on:
  push:
    branches: [final-code-2026-polish]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Finalize attention transitions and submission correctness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install dependencies
        run: npm ci
      - name: Run uploaded patch
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          s=pathlib.Path('.github/workflows/apply-final-patch.yml').read_text()
          b=s.split('PATCH_B64: >-',1)[1].split('\n        run:',1)[0]
          b=''.join(line.strip() for line in b.splitlines())
          pathlib.Path('/tmp/apply.py').write_bytes(gzip.decompress(base64.b64decode(b)))
          PY
          python3 /tmp/apply.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add README.md server.js lib/attention.js public/app.js public/index.html public/styles.css test/attention.test.js test/server.test.js
          git commit -m "Finalize attention transitions and submission correctness"
          git push origin HEAD:final-code-2026-polish
